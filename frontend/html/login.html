<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Personal Expense Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header>
        <h1>Personal Expense Tracker</h1>
    </header>

    <nav>
        <a href="index.html">Home</a> |
        <a href="login.html">Login</a> |
        <a href="signup.html">Sign Up</a>
    </nav>

    <main>
        <section>
            <h2>Login to Your Account</h2>
            <p>Enter your credentials to access your expense tracker.</p>
            <form id="loginForm">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" name="email" placeholder="Enter your email address" required>

                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" name="password" placeholder="Enter your password" required>

                <button type="submit">Login</button>
                <button type="reset">Reset</button>
            </form>
            <p>Don't have an account? <a href="signup.html">Sign up here</a>.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Personal Expense Tracker. All rights reserved.</p>
    </footer>

    <script src="/js/script.js"></script>
</body>

</html>
